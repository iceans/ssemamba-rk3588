# =============================================================================
# yolov8-trace2.yaml —— TRACE-v2: 证据驱动重设计
# -----------------------------------------------------------------------------
# 每个决策对应一条消融证据(DAUB 统一口径, mAP50/mAP50-95):
#   * 时序块只放 P3:  E1(仅P3) 0.8960/0.6123 > REF(P2+P3) 0.9030/0.6033 的定位项
#     → 删除 P2 时序块(v1 层4), P2 特征直通、头部经 TemporalSelect 取末帧
#   * TraceV2 = 对流+各向同性扩散+普通门+ego:
#       B2(无新息门) 0.9279/0.6145 全场最优 → 门控回归输入依赖 sigmoid
#       A4(iso) 0.6029 ≈ REF(aniso) 0.6033  → 删除各向异性
#       B1(无ego) 0.5880 < REF               → 保留伽利略分解
#       A4 > A1 > A2                          → 对流+扩散为耦合对整体保留
#   * HFStem+SPDConv 原样保留: REF−C2=+2.1(DoG 是主力), 未测"有DoG无SPD"组合,
#     不做未验证的改动
#   * 头保持 P2-P5 四尺度: 最优两行(B2/E1)均在此头下取得; D1(三尺度)的
#     0.9317 mAP50 / 0.9132 P 说明三尺度头是强效率变体, 见文末备选
# 验收标准: v2 组合未被整体测过, 训完须对照 B2 的 0.9279/0.6145;
#           若不达标, 回退方案 = 直接采用 B2 配置(其 ckpt 已存在且为当前最优)。
# 注册: tasks.py 增加  elif m is TraceV2: c2 = ch[f]; args = [ch[f], *args]
# =============================================================================
nc: 1
ch: 8            # = nframes(5) + key_channels(3)
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, TemporalUnfold, [5, 3, 3]]                # 0  (B,8,H,W)->(B*5,3,H,W)
  - [-1, 1, HFStem, [64]]                             # 1  P1/2  M1: DoG+SPD
  - [-1, 1, SPDConv, [128]]                           # 2  P2/4
  - [-1, 3, C2f, [128, True]]                         # 3  P2 特征(B*T, 供头部末帧分支)
  - [-1, 1, Conv, [256, 3, 2]]                        # 4  P3/8
  - [-1, 6, C2f, [256, True]]                         # 5
  - [-1, 1, TraceV2, [5, 16, 1.0, 4, 3.0, 'last', 2, 0.25, True, True]]  # 6 P3 时序
  - [-1, 1, Conv, [512, 3, 2]]                        # 7  P4/16
  - [-1, 6, C2f, [512, True]]                         # 8
  - [-1, 1, Conv, [1024, 3, 2]]                       # 9  P5/32
  - [-1, 3, C2f, [1024, True]]                        # 10
  - [-1, 1, SPPF, [1024, 5]]                          # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 12
  - [[-1, 8], 1, Concat, [1]]                         # 13
  - [-1, 3, C2f, [512]]                               # 14 P4 中间
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 15
  - [[-1, 6], 1, Concat, [1]]                         # 16 与 P3 时序输出(B)拼接
  - [-1, 3, C2f, [256]]                               # 17 P3 中间
  - [3, 1, TemporalSelect, [5]]                       # 18 P2 支路取末帧(B*T->B)
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]        # 19
  - [[-1, 18], 1, Concat, [1]]                        # 20
  - [-1, 3, C2f, [128]]                               # 21 P2/4  输出
  - [-1, 1, Conv, [128, 3, 2]]                        # 22
  - [[-1, 17], 1, Concat, [1]]                        # 23
  - [-1, 3, C2f, [256]]                               # 24 P3/8  输出
  - [-1, 1, Conv, [256, 3, 2]]                        # 25
  - [[-1, 14], 1, Concat, [1]]                        # 26
  - [-1, 3, C2f, [512]]                               # 27 P4/16 输出
  - [-1, 1, Conv, [512, 3, 2]]                        # 28
  - [[-1, 11], 1, Concat, [1]]                        # 29
  - [-1, 3, C2f, [1024]]                              # 30 P5/32 输出
  - [[21, 24, 27, 30], 1, Detect, [nc]]               # 31 P2-P5 四尺度

# -----------------------------------------------------------------------------
# 备选变体(按 D1 证据, 三尺度头效率版; 需要时另存 yolov8-trace2-p3head.yaml):
#   删除层 18-23 的 P2 支路, 头为标准 P3-P5 三层, Detect 取 [P3,P4,P5];
#   预期 mAP50/P 更高(D1: 0.9317/0.9132)、mAP50-95 略降、推理更快。
# -----------------------------------------------------------------------------
