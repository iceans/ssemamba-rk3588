# ============================================================================
# E7 插入位置消融: P2 (小 d_state=16, 纯谱域省显存) + P3 (d_state=32, hybrid)
# P2-only 变体 = 本文件把第 6 层换回直连; P3-only = yolov8s-spectrans-p3.yaml
# ============================================================================
nc: 1
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv,    [64, 3, 2]]     # 0  P1/2
  - [-1, 1, SPDConv, [128]]          # 1  P2/4
  - [-1, 3, C2f,     [128, True]]    # 2
  - [-1, 1, SpecTransSSM, [16, 8, "spectral", True, True, True, True, "input", 4.0, 4]]  # 3  P2 时序 (轻量)
  - [-1, 1, SPDConv, [256]]          # 4  P3/8
  - [-1, 6, C2f,     [256, True]]    # 5
  - [-1, 1, SpecTransSSM, [32, 8, "hybrid", True, True, True, True, "input", 4.0, 8]]    # 6  P3 时序 (主力)
  - [-1, 1, Conv,    [512, 3, 2]]    # 7  P4/16
  - [-1, 6, C2f,     [512, True]]    # 8
  - [-1, 1, Conv,    [1024, 3, 2]]   # 9  P5/32
  - [-1, 3, C2f,     [1024, True]]   # 10
  - [-1, 1, SPPF,    [1024, 5]]      # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 8], 1, Concat, [1]]                   # 13
  - [-1, 3, C2f, [512]]                         # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 6], 1, Concat, [1]]                   # 16  ← 接后时序 P3
  - [-1, 3, C2f, [256]]                         # 17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 3], 1, Concat, [1]]                   # 19  ← 接后时序 P2
  - [-1, 3, C2f, [128]]                         # 20  P2/4
  - [-1, 1, Conv, [128, 3, 2]]                  # 21
  - [[-1, 17], 1, Concat, [1]]                  # 22
  - [-1, 3, C2f, [256]]                         # 23  P3/8
  - [-1, 1, Conv, [256, 3, 2]]                  # 24
  - [[-1, 14], 1, Concat, [1]]                  # 25
  - [-1, 3, C2f, [512]]                         # 26  P4/16
  - [-1, 1, Conv, [512, 3, 2]]                  # 27
  - [[-1, 11], 1, Concat, [1]]                  # 28
  - [-1, 3, C2f, [1024]]                        # 29  P5/32
  - [[20, 23, 26, 29], 1, Detect, [nc]]         # 30
