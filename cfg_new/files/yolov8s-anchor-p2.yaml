# ============================================================================
# E0 强化单帧锚点 (所有时序对比的基准): YOLOv8s + P2头 + SPD-Conv, 无时序块
# 训练侧配套 (不在 yaml 中): NWD-CIoU 混合回归, 关闭 Mosaic/MixUp, 热图深监督
# 消融纪律: 一切时序增益以本模型为锚, 而非原版 YOLOv8
# ============================================================================
nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,    [64, 3, 2]]     # 0  P1/2
  - [-1, 1, SPDConv, [128]]          # 1  P2/4   无损下采样 (M1)
  - [-1, 3, C2f,     [128, True]]    # 2
  - [-1, 1, SPDConv, [256]]          # 3  P3/8
  - [-1, 6, C2f,     [256, True]]    # 4
  - [-1, 1, Conv,    [512, 3, 2]]    # 5  P4/16
  - [-1, 6, C2f,     [512, True]]    # 6
  - [-1, 1, Conv,    [1024, 3, 2]]   # 7  P5/32
  - [-1, 3, C2f,     [1024, True]]   # 8
  - [-1, 1, SPPF,    [1024, 5]]      # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 3, C2f, [512]]                         # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14
  - [-1, 3, C2f, [256]]                         # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 2], 1, Concat, [1]]                   # 17
  - [-1, 3, C2f, [128]]                         # 18  P2/4  小目标主战场
  - [-1, 1, Conv, [128, 3, 2]]                  # 19
  - [[-1, 15], 1, Concat, [1]]                  # 20
  - [-1, 3, C2f, [256]]                         # 21  P3/8
  - [-1, 1, Conv, [256, 3, 2]]                  # 22
  - [[-1, 12], 1, Concat, [1]]                  # 23
  - [-1, 3, C2f, [512]]                         # 24  P4/16
  - [-1, 1, Conv, [512, 3, 2]]                  # 25
  - [[-1, 9], 1, Concat, [1]]                   # 26
  - [-1, 3, C2f, [1024]]                        # 27  P5/32
  - [[18, 21, 24, 27], 1, Detect, [nc]]         # 28
