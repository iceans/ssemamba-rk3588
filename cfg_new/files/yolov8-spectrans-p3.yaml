# ============================================================================
# 主消融载体: 锚点 + SpecTransSSM @ P3 (backbone 第5层, 零初始化=恒等, 热插拔)
# SpecTransSSM args: [d_state, seq_len, mode, use_adv, use_diff, use_decay,
#                     selective, gate, v_max, pad]
# 绝大多数消融 (E1/E2/E3/E5/E6) 只改第 5 行的 args, 不换 yaml —— 反模块堆叠纪律
# ============================================================================
nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv,    [64, 3, 2]]     # 0  P1/2
  - [-1, 1, SPDConv, [128]]          # 1  P2/4
  - [-1, 3, C2f,     [128, True]]    # 2
  - [-1, 1, SPDConv, [256]]          # 3  P3/8
  - [-1, 6, C2f,     [256, True]]    # 4
  # ---- 唯一的时序层: 消融矩阵只动这一行 ----
  - [-1, 1, SpecTransSSM, [32, 8, "hybrid", True, True, True, True, "input", 4.0, 8]]  # 5
  - [-1, 1, Conv,    [512, 3, 2]]    # 6  P4/16
  - [-1, 6, C2f,     [512, True]]    # 7
  - [-1, 1, Conv,    [1024, 3, 2]]   # 8  P5/32
  - [-1, 3, C2f,     [1024, True]]   # 9
  - [-1, 1, SPPF,    [1024, 5]]      # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 7], 1, Concat, [1]]                   # 12
  - [-1, 3, C2f, [512]]                         # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 5], 1, Concat, [1]]                   # 15  ← 接后时序 P3
  - [-1, 3, C2f, [256]]                         # 16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 2], 1, Concat, [1]]                   # 18
  - [-1, 3, C2f, [128]]                         # 19  P2/4
  - [-1, 1, Conv, [128, 3, 2]]                  # 20
  - [[-1, 16], 1, Concat, [1]]                  # 21
  - [-1, 3, C2f, [256]]                         # 22  P3/8
  - [-1, 1, Conv, [256, 3, 2]]                  # 23
  - [[-1, 13], 1, Concat, [1]]                  # 24
  - [-1, 3, C2f, [512]]                         # 25  P4/16
  - [-1, 1, Conv, [512, 3, 2]]                  # 26
  - [[-1, 10], 1, Concat, [1]]                  # 27
  - [-1, 3, C2f, [1024]]                        # 28  P5/32
  - [[19, 22, 25, 28], 1, Detect, [nc]]         # 29
