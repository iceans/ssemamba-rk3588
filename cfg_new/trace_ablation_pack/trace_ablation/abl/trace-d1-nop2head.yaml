# =============================================================================
# trace-d1-nop2head.yaml —— 消融变体 D1
# 改动: 检测头改回P3-P5三尺度(骨干含P2时序块不动)
# 理由: P2头对tiny目标的贡献, 与C组(编码端)解耦
# 由 gen_ablations.py 生成, 请勿手改; 配方变更后重跑生成器。
# =============================================================================
nc: 1
ch: 8        # = nframes(5) + key_channels(3)
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, TemporalUnfold, [5, 3, 3]]              # 0  (B,8,H,W)->(B*5,3,H,W)
  - [-1, 1, HFStem, [64]]                            # 1  P1/2 M1: DoG+SPD
  - [-1, 1, SPDConv, [128]]                          # 2  P2/4 M1
  - [-1, 3, C2f, [128, True]]                         # 3
  - [-1, 1, TraceSS2D, [5, 8, 1.0, 4, 3.0, 'all', 2, 0.25, False, False, True, False]]
  - [-1, 1, Conv, [256, 3, 2]]                        # 5  P3/8
  - [-1, 6, C2f, [256, True]]                         # 6
  - [-1, 1, TraceSS2D, [5, 16, 1.0, 4, 3.0, 'last', 2, 0.25, True, True, True, True]]
  - [-1, 1, Conv, [512, 3, 2]]                        # 8  P4/16
  - [-1, 6, C2f, [512, True]]                         # 9
  - [-1, 1, Conv, [1024, 3, 2]]                       # 10 P5/32
  - [-1, 3, C2f, [1024, True]]                        # 11
  - [-1, 1, SPPF, [1024, 5]]                          # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 13
  - [[-1, 9], 1, Concat, [1]]                         # 14
  - [-1, 3, C2f, [512]]                               # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 16
  - [[-1, 7], 1, Concat, [1]]                         # 17
  - [-1, 3, C2f, [256]]                               # 18 P3/8 输出
  - [-1, 1, Conv, [256, 3, 2]]                        # 19
  - [[-1, 15], 1, Concat, [1]]                        # 20
  - [-1, 3, C2f, [512]]                               # 21 P4/16 输出
  - [-1, 1, Conv, [512, 3, 2]]                        # 22
  - [[-1, 12], 1, Concat, [1]]                        # 23
  - [-1, 3, C2f, [1024]]                              # 24 P5/32 输出
  - [[18, 21, 24], 1, Detect, [nc]]                   # 25 P3-P5(无P2头)
